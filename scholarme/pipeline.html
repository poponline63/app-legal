<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Shared scholarship pipeline · ScholarMe</title>
<style>
  :root { --bg:#0f1012; --card:#17181b; --border:#26282c; --text:#f3f1e9; --muted:#a0a3a8; --lime:#c2f046; --ink:#111113; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.5; }
  .wrap { max-width:680px; margin:0 auto; padding:28px 18px 64px; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .logo { width:26px; height:26px; border-radius:7px; background:var(--lime); color:var(--ink); font-weight:800; display:grid; place-items:center; font-size:15px; }
  .brand { font-weight:800; letter-spacing:-0.3px; }
  h1 { font-size:22px; margin:18px 0 2px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 22px; }
  .stat-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 16px; flex:1; min-width:120px; }
  .stat b { display:block; font-size:24px; letter-spacing:-0.5px; }
  .stat span { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:0.6px; }
  .item { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .item h3 { margin:0 0 2px; font-size:16px; }
  .item .org { color:var(--muted); font-size:13px; }
  .row2 { display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:10px; flex-wrap:wrap; }
  .amt { font-weight:800; }
  .badge { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; padding:4px 9px; border-radius:999px; border:1px solid var(--border); color:var(--muted); }
  .badge.submitted, .badge.awarded { background:var(--lime); color:var(--ink); border-color:var(--lime); }
  .foot { color:var(--muted); font-size:12px; margin-top:26px; text-align:center; }
  .center { text-align:center; padding:60px 0; color:var(--muted); }
  a.cta { color:var(--lime); }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">S</div><div class="brand">ScholarMe</div></header>
  <div id="app"><div class="center">Loading…</div></div>
  <p class="foot">A read-only snapshot shared from ScholarMe. Only a first name is shared. The student can revoke this link at any time.</p>
</div>
<script>
  const SUPABASE_URL = 'https://mcepifbekmmchjfjtsti.supabase.co';
  const ANON_KEY = 'sb_publishable_VfUtjMfS1dExsYGVUCeQ0A__rgnp0QT';
  const app = document.getElementById('app');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const money = (n) => typeof n === 'number' ? '$' + n.toLocaleString() : esc(n);
  const STATUS_LABEL = { to_apply:'Saved', in_progress:'In progress', submitted:'Submitted', awarded:'Won', not_selected:'Not selected' };

  function render(snapshot) {
    if (!snapshot || !Array.isArray(snapshot.items)) {
      app.innerHTML = '<div class="center">This link is no longer active.</div>';
      return;
    }
    const items = snapshot.items;
    const submitted = items.filter(i => i.status === 'submitted' || i.status === 'awarded').length;
    const total = items.reduce((s, i) => s + (typeof i.amount === 'number' ? i.amount : 0), 0);
    let html = '';
    html += '<h1>' + esc(snapshot.student || 'A student') + '’s scholarships</h1>';
    html += '<p class="sub">Shared from ScholarMe' + (snapshot.updatedAt ? ' · updated ' + esc(new Date(snapshot.updatedAt).toLocaleDateString()) : '') + '</p>';
    html += '<div class="stat-row">';
    html += '<div class="stat"><b>' + items.length + '</b><span>Tracked</span></div>';
    html += '<div class="stat"><b>' + submitted + '</b><span>Applied</span></div>';
    html += '<div class="stat"><b>' + money(total) + '</b><span>In play</span></div>';
    html += '</div>';
    if (!items.length) {
      html += '<div class="center">No scholarships tracked yet.</div>';
    } else {
      for (const i of items) {
        const st = i.status || 'to_apply';
        html += '<div class="item">';
        html += '<h3>' + esc(i.name) + '</h3>';
        html += '<div class="org">' + esc(i.organization || '') + '</div>';
        html += '<div class="row2"><span class="amt">' + money(i.amount) + '</span>';
        html += '<span class="badge ' + esc(st) + '">' + esc(STATUS_LABEL[st] || st) + '</span></div>';
        html += '</div>';
      }
    }
    app.innerHTML = html;
  }

  async function load() {
    const token = new URLSearchParams(location.search).get('t');
    if (!token) { app.innerHTML = '<div class="center">Missing share link.</div>'; return; }
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_shared_pipeline', {
        method: 'POST',
        headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_token: token })
      });
      if (!res.ok) throw new Error('http ' + res.status);
      const snapshot = await res.json();
      render(snapshot);
    } catch (e) {
      app.innerHTML = '<div class="center">This link is no longer active.</div>';
    }
  }
  load();
</script>
</body>
</html>
